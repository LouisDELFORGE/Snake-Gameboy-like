
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

    <main class="gameboy">

        <div class="screen-container">
            <div class="screen-header">
                <span>DOT MATRIX WITH STEREO SOUND</span>
                <span class="battery">
                    <span class="battery-light"></span>
                </span>
            </div>

            <div class="screen">
                <canvas id="game-screen"></canvas>
            </div>

            <div class="screen-footer">BATTERY</div>
        </div>

        <div class="brand">
            <span class="nintendo">Nintendo</span>
            <span class="gameboy-text">GAME BOY</span>
        </div>

        <div class="controls">
            <div class="dpad">
                <div class="dpad-vertical"></div>
                <div class="dpad-horizontal"></div>
            </div>

            <div class="action-buttons">
                <div class="action-button">B</div>
                <div class="action-button">A</div>
            </div>
        </div>

        <div class="menu-buttons">
            <div class="menu-button"><span>SELECT</span></div>
            <div class="menu-button"><span>START</span></div>
        </div>

        <div class="speaker">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>

    </main>

</body>
</html>
